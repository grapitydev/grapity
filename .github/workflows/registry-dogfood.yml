name: Registry dogfood

# Grapity on Grapity: our own registry API contract (specs/grapity-registry.yaml)
# is validated on pull requests and merges to main, and pushed to our public
# registry when a software release ships, through the same composite action we
# ship to users (./actions/registry).
#
# The push fires on the publish-registry-spec repository_dispatch sent by
# release.yml after release-please creates a release, and only when specs/**
# changed since the previous release tag: an unchanged spec classifies as patch
# and would mint a meaningless version per release.
#
# Requires the GRAPITY_REGISTRY_URL repository variable
# (https://registry.grapity.dev) and the GRAPITY_CI_CLIENT_SECRET secret.
# Without the variable, all jobs skip.

on:
  pull_request:
    branches: [main]
    paths:
      - specs/**
      - actions/registry/**
      - .github/workflows/registry-dogfood.yml
  push:
    branches: [main]
    paths:
      - specs/**
  repository_dispatch:
    types: [publish-registry-spec]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Fork pull requests never receive repository secrets (GitHub limitation),
    # so external contributions skip validation instead of failing on a
    # missing client secret. Maintainers can validate locally with the CLI.
    # Validation re-runs at release time against the registry's current state
    # and gates the push below (registry state may have moved since the pull
    # request was validated).
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.GRAPITY_REGISTRY_URL != '') || (github.event_name == 'push' && vars.GRAPITY_REGISTRY_URL != '') || (github.event_name == 'repository_dispatch' && vars.GRAPITY_REGISTRY_URL != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate against the registry
        uses: ./actions/registry
        with:
          command: validate
          spec: specs/grapity-registry.yaml
          name: grapity-registry
          registry-url: ${{ vars.GRAPITY_REGISTRY_URL }}
          keycloak-server-url: https://keycloak.grapity.dev
          realm: grapity
          client-id: grapity-ci
          client-secret: ${{ secrets.GRAPITY_CI_CLIENT_SECRET }}

  push:
    needs: validate
    if: github.event_name == 'repository_dispatch' && vars.GRAPITY_REGISTRY_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for spec changes since the previous release
        id: changes
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | sed -n 2p)
          if [ -z "$PREV_TAG" ]; then
            echo "No previous release tag; treating as changed"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$PREV_TAG"...HEAD -- specs/; then
            echo "No specs/ changes since $PREV_TAG; skipping push"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "specs/ changed since $PREV_TAG"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push to the registry
        if: steps.changes.outputs.changed == 'true'
        uses: ./actions/registry
        with:
          command: push
          spec: specs/grapity-registry.yaml
          name: grapity-registry
          visibility: public
          # Publishes 0.x pre-release versions until the registry API is
          # declared stable; dropping this line graduates the spec to 1.0.0.
          prerelease: "true"
          pushed-by: github-actions[bot]
          registry-url: ${{ vars.GRAPITY_REGISTRY_URL }}
          keycloak-server-url: https://keycloak.grapity.dev
          realm: grapity
          client-id: grapity-ci
          client-secret: ${{ secrets.GRAPITY_CI_CLIENT_SECRET }}
