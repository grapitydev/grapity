name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release-please
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Dispatch publish for releases
        if: ${{ steps.release-please.outputs.releases_created == 'true' }}
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: publish-package
          client-payload: '{"tag": "latest"}'

      - name: Dispatch binary builds for releases
        if: ${{ steps.release-please.outputs.releases_created == 'true' }}
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: build-binaries
          client-payload: '{"tag": "${{ steps.release-please.outputs.tag_name }}"}'

      - name: Dispatch server image publish for releases
        if: ${{ steps.release-please.outputs.releases_created == 'true' }}
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: publish-image
          client-payload: '{"tag": "${{ steps.release-please.outputs.tag_name }}"}'

      # The registry spec publish is NOT dispatched here: the dogfood action
      # installs the released CLI binary, which only exists once the
      # build-binaries pipeline uploads the release assets. binaries.yml
      # dispatches publish-registry-spec after publish-binaries succeeds.
