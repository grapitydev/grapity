name: Grapity Registry
description: >-
  Validate an API spec against a Grapity registry on pull requests, or push a
  new version on merge. Validates backward compatibility and propagates
  registry-assigned versions without manual CLI work.
inputs:
  command:
    description: 'Operation to run: "validate" (PR checks) or "push" (register a new version)'
    required: true
  spec:
    description: "Path to the OpenAPI or AsyncAPI document"
    required: true
  name:
    description: "Name of the spec in the registry"
    required: true
  registry-url:
    description: "Base URL of the Grapity registry (e.g. https://registry.grapity.dev)"
    required: true
  keycloak-server-url:
    description: "Keycloak server URL (e.g. https://keycloak.grapity.dev)"
    required: true
  realm:
    description: "Keycloak realm"
    required: true
  client-id:
    description: "Keycloak client id (client credentials grant, needs specs:write)"
    required: true
  client-secret:
    description: "Keycloak client secret"
    required: true
  audience:
    description: "Keycloak audience (optional)"
    required: false
    default: ""
  visibility:
    description: 'Spec visibility on push: "private" or "public" (optional, push only)'
    required: false
    default: ""
  git-ref:
    description: "Git commit SHA recorded on the version (defaults to github.sha)"
    required: false
    default: ""
  pushed-by:
    description: "Identity recorded as the pusher (defaults to github.actor)"
    required: false
    default: ""
  cli-version:
    description: 'grapity CLI version to install (e.g. v0.12.0, default: latest)'
    required: false
    default: "latest"

runs:
  using: composite
  steps:
    - name: Install grapity CLI
      shell: bash
      env:
        GRAPITY_VERSION: ${{ inputs.cli-version }}
        GRAPITY_FORCE_BINARY: "1"
      run: curl -fsSL https://packages.grapity.dev/install.sh | sh

    - name: Configure registry remote
      shell: bash
      env:
        AUDIENCE: ${{ inputs.audience }}
      run: |
        CONFIG_PATH="$RUNNER_TEMP/grapity-config.yaml"
        {
          echo "mode: remote"
          echo "remote:"
          echo "  url: ${{ inputs.registry-url }}"
          echo "  auth:"
          echo "    mode: keycloak"
          echo "    serverUrl: ${{ inputs.keycloak-server-url }}"
          echo "    realm: ${{ inputs.realm }}"
          echo "    clientId: ${{ inputs.client-id }}"
          if [ -n "$AUDIENCE" ]; then
            echo "    audience: $AUDIENCE"
          fi
        } > "$CONFIG_PATH"

    - name: Validate spec
      if: inputs.command == 'validate'
      shell: bash
      env:
        GRAPITY_CONFIG_PATH: ${{ runner.temp }}/grapity-config.yaml
        GRAPITY_CLIENT_SECRET: ${{ inputs.client-secret }}
      run: |
        set +e
        OUTPUT=$(grapity registry validate "${{ inputs.spec }}" --against "${{ inputs.name }}" 2>&1 | sed 's/\x1B\[[0-9;]*m//g')
        STATUS=$?
        set -e
        echo "$OUTPUT"
        {
          echo "### Grapity compatibility check"
          echo ""
          echo '```text'
          echo "$OUTPUT"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        exit $STATUS

    - name: Push spec
      if: inputs.command == 'push'
      shell: bash
      env:
        GRAPITY_CONFIG_PATH: ${{ runner.temp }}/grapity-config.yaml
        GRAPITY_CLIENT_SECRET: ${{ inputs.client-secret }}
        GIT_REF: ${{ inputs.git-ref || github.sha }}
        PUSHED_BY: ${{ inputs.pushed-by || github.actor }}
        VISIBILITY: ${{ inputs.visibility }}
      run: |
        ARGS=(--name "${{ inputs.name }}" --git-ref "$GIT_REF" --pushed-by "$PUSHED_BY")
        if [ -n "$VISIBILITY" ]; then
          ARGS+=(--visibility "$VISIBILITY")
        fi
        set +e
        OUTPUT=$(grapity registry push "${{ inputs.spec }}" "${ARGS[@]}" 2>&1 | sed 's/\x1B\[[0-9;]*m//g')
        STATUS=$?
        set -e
        echo "$OUTPUT"
        {
          echo "### Grapity registry push"
          echo ""
          echo '```text'
          echo "$OUTPUT"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        exit $STATUS
